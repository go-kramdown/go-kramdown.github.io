baseURL = "https://go-kramdown.github.io/"
languageCode = "en-us"
title = "go-kramdown"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.48:1, bright on the dark background 5.16:1.
  base = "#134e4a"
  deep = "#0c302d"
  bright = "#0d9488"
  shadow = "rgba(19,78,74,.7)"
  glow = "rgba(19,78,74,.6)"
  wash = "rgba(19,78,74,.10)"
  washDeep = "rgba(12,48,45,.06)"
  chipBg = "#e2f2f1"
  chipBorder = "#b6dfdb"
  chipFg = "#0c302d"
  chipBgDark = "rgba(13,148,136,.14)"
  chipBorderDark = "rgba(13,148,136,.32)"
  chipFgDark = "#7ac4be"
  statsEnd = "#c5e5e2"
  bandText = "#d8eeec"
  accent = "#134e4a"
  accentDark = "#0d9488"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-kramdown.github.io/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-kramdown"
  label = "GitHub"

# The architectures the tests RUN on, read from the library's CI.
[params.mantra]
  goarch = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x"]
